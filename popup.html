<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Device ID</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <img src="icon.png" alt="" class="logo" />
        <h1>My Device ID</h1>
      </header>

      <section class="card">
        <label class="field-label">Device ID</label>
        <div class="id-row">
          <code id="device-id" class="device-id">Loading…</code>
          <button id="copy-id" class="btn btn-ghost" title="Copy ID">Copy</button>
        </div>
      </section>

      <section class="card">
        <label class="field-label" for="device-name">Device Name</label>
        <input type="text" id="device-name" placeholder="e.g. My Laptop" />
        <div class="actions">
          <button id="save-name" class="btn btn-primary">Save Name</button>
          <button id="regenerate" class="btn btn-danger">Regenerate ID</button>
        </div>
      </section>

      <p id="status" class="status"></p>

      <footer class="footer">
        Developed by
        <a href="https://github.com/engacs" target="_blank" rel="noopener">
          Eng Acs
        </a>
        ·
        <a
          href="https://github.com/engacs/MyDevice-ID"
          target="_blank"
          rel="noopener"
        >
          GitHub
        </a>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
